<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>ESPN CORS Test</title></head>
<body>
<h1>ESPN CORS Test</h1>
<pre id="output">Testing...</pre>
<script>
const output = document.getElementById('output');
const tests = [
  ['base', 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard'],
  ['week', 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?week=1&seasontype=2'],
  ['date', 'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard?dates=20260910']
];
(async () => {
  const results = [];
  for (const [name, url] of tests) {
    const started = performance.now();
    try {
      const response = await fetch(url, { cache: 'no-store' });
      const text = await response.text();
      let json = null;
      try { json = JSON.parse(text); } catch {}
      results.push({ name, ok: response.ok, status: response.status, type: response.type, url, elapsedMs: Math.round(performance.now()-started), events: json?.events?.length ?? null, error: null });
    } catch (error) {
      results.push({ name, ok: false, status: null, type: null, url, elapsedMs: Math.round(performance.now()-started), events: null, error: String(error) });
    }
  }
  output.textContent = JSON.stringify({ origin: location.origin, results }, null, 2);
})();
</script>
</body>
</html>
