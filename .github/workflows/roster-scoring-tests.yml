name: Roster Scoring Tests

on:
  push:
    paths:
      - 'roster-scoring.js'
      - 'test-roster-scoring.js'
      - '.github/workflows/roster-scoring-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run roster scoring tests
        run: node test-roster-scoring.js
