name: One-time NFL Games navigation integration

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  migrate-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch navigation and verify
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          repo_root = Path.cwd()
          backup_ref = "origin/backup-20260909-before-nfl-games-navigation"
          pages = [
              "index.html", "trade-chart.html", "rookie-idp-rankings.html", "tips.html",
              "bye-weeks.html", "my-team.html", "strength-of-schedule.html",
              "IDP26rankings.html", "nfl-games.html",
          ]
          hrefs = [
              "index.html", "trade-chart.html", "rookie-idp-rankings.html", "tips.html",
              "bye-weeks.html", "my-team.html", "strength-of-schedule.html",
              "IDP26rankings.html", "nfl-games.html",
          ]

          subprocess.run(["git", "fetch", "origin", "backup-20260909-before-nfl-games-navigation"], check=True)
          result = subprocess.run(["git", "diff", "--quiet", backup_ref, "--", *pages], check=False)
          if result.returncode != 0:
              raise SystemExit("ABORTED: production pages differ from the verified backup branch. No navigation changes were made.")

          canonical_links = [
              ("index.html", "Players Trending"),
              ("trade-chart.html", "Dynasty Trade Calculator"),
              ("rookie-idp-rankings.html", "IDP Rankings (Rookies)"),
              ("tips.html", "Tips"),
              ("bye-weeks.html", "Bye Weeks"),
              ("my-team.html", "My Fantasy Team"),
              ("strength-of-schedule.html", "Strength of Schedule"),
              ("IDP26rankings.html", "2026 IDP Rankings"),
              ("nfl-games.html", "NFL Games"),
          ]

          def nav_html(active, wrapper="div"):
              lines = [f'<{wrapper} class="nfln-nav" aria-label="Site navigation">']
              for href, label in canonical_links:
                  cls = ' class="active"' if href == active else ' class="inactive"'
                  lines.append(f'  <a href="{href}"{cls}>{label}</a>')
              lines.append(f"</{wrapper}>")
              return "\n".join(lines)

          for page in pages[:8]:
              path = repo_root / page
              text = path.read_text(encoding="utf-8")
              if page == "my-team.html":
                  pattern = re.compile(r'<nav\s+class=["\']nav["\'][^>]*>.*?</nav>', re.S | re.I)
                  replacement = nav_html(page, "nav")
              else:
                  pattern = re.compile(r'<(div|nav)\s+class=["\']nfln-nav["\'][^>]*>.*?</\1>', re.S | re.I)
                  matches = list(pattern.finditer(text))
                  if len(matches) != 1:
                      raise SystemExit(f"ABORTED: expected exactly one existing NFL navigation block in {page}, found {len(matches)}")
                  replacement = nav_html(page, matches[0].group(1).lower())
              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"ABORTED: expected exactly one navigation block in {page}, found {len(matches)}")
              path.write_text(pattern.sub(replacement, text, count=1), encoding="utf-8")

          nfl_path = repo_root / "nfl-games.html"
          text = nfl_path.read_text(encoding="utf-8")
          if re.search(r'<(div|nav)\s+class=["\']nfln-nav["\']', text, re.I):
              raise SystemExit("ABORTED: nfl-games.html already contains an NFL navigation block")
          nav = nav_html("nfl-games.html", "nav")
          css = '''
<style id="site-navigation-layout-fix-nfl-games">
.nfln-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.nfln-nav a { display: block; text-align: center; }
@media (max-width: 900px) { .nfln-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .nfln-nav { grid-template-columns: 1fr; } }
</style>
'''
          if "site-navigation-layout-fix-nfl-games" not in text:
              if "</head>" not in text:
                  raise SystemExit("ABORTED: could not find </head> in nfl-games.html")
              text = text.replace("</head>", css + "</head>", 1)
          inserted = False
          for marker in ["<main", '<div class="container">', '<div class="controls">']:
              if marker in text:
                  text = text.replace(marker, nav + "\n" + marker, 1)
                  inserted = True
                  break
          if not inserted:
              raise SystemExit("ABORTED: could not find a safe insertion point for navigation in nfl-games.html")
          nfl_path.write_text(text, encoding="utf-8")

          state_path = repo_root / "PROJECT_STATE.md"
          state = state_path.read_text(encoding="utf-8")
          heading = "## 2026-09-09 — NFL Games navigation integration"
          if heading not in state:
              section = f'''\n\n{heading}\n- Integrated **NFL Games** into the main site navigation across all 9 production pages.\n- Synchronized navigation order across every page; **Preseason** remains excluded.\n- Set the active navigation state to the current page on each page.\n- Added responsive 3-column / 2-column / 1-column navigation behavior to `nfl-games.html`.\n- No NFL Games data source, ESPN endpoint, normalization logic, or existing page functionality was changed.\n'''
              state_path.write_text(state.rstrip() + section, encoding="utf-8")

          for page in pages:
              text = (repo_root / page).read_text(encoding="utf-8")
              nav_matches = list(re.finditer(r'<(div|nav)\s+class=["\']nfln-nav["\'][^>]*>.*?</\1>', text, re.S | re.I))
              if len(nav_matches) != 1:
                  raise SystemExit(f"VERIFICATION FAILED: expected one NFL navigation block in {page}")
              nav_text = nav_matches[0].group(0)
              for href in hrefs:
                  if not re.search(rf'href=["\']{re.escape(href)}["\']', nav_text, re.I):
                      raise SystemExit(f"VERIFICATION FAILED: {href} missing from navigation in {page}")
              if re.search(r"Preseason", nav_text, re.I):
                  raise SystemExit(f"VERIFICATION FAILED: Preseason detected in navigation of {page}")
              active = re.findall(r'<a[^>]+href=["\']([^"\']+)["\'][^>]*class=["\']active["\']', nav_text, re.I)
              if active != [page]:
                  raise SystemExit(f"VERIFICATION FAILED: active state in {page} is {active}, expected [{page}]")
          print("Navigation migration and verification completed successfully.")
          PY

      - name: Commit production migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html trade-chart.html rookie-idp-rankings.html tips.html bye-weeks.html my-team.html strength-of-schedule.html IDP26rankings.html nfl-games.html PROJECT_STATE.md
          git rm .github/workflows/one-time-add-nfl-games-navigation.yml
          git diff --cached --check
          git commit -m "Add NFL Games to main navigation"
          git push origin HEAD:main
