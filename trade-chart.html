<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dynasty Trade Calculator</title>
<style>
  :root {
    --page-bg: #d5d8da;
    --page-bg-dark: #c4c8cc;
    --patriots-blue: #0b2a4a;
    --patriots-blue-hover: #123b63;
    --patriots-red: #c8102e;
    --silver: #b5b9bd;
    --silver-light: #eef0f1;
    --silver-dark: #8f959a;
    --text: #1a1a1a;
    --muted: #666c72;
    --card-text: #ffffff;
    --card-soft: #d5dfe8;
    --border: #c5c9cc;
  }

  * { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 24px 16px 60px;
    font-family: Arial, Helvetica, sans-serif;
    color: var(--text);
    min-height: 100vh;
    background:
      linear-gradient(rgba(213,216,218,0.94), rgba(196,200,204,0.94)),
      repeating-linear-gradient(
        90deg,
        transparent 0,
        transparent calc(12.5% - 1px),
        rgba(255,255,255,0.24) calc(12.5% - 1px),
        rgba(255,255,255,0.24) 12.5%
      ),
      repeating-linear-gradient(
        0deg,
        transparent 0,
        transparent 92px,
        rgba(255,255,255,0.18) 92px,
        rgba(255,255,255,0.18) 94px
      );
    background-attachment: fixed;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    background:
      linear-gradient(
        90deg,
        transparent 0 49.7%,
        rgba(255,255,255,0.30) 49.7% 50.3%,
        transparent 50.3% 100%
      );
    opacity: 0.75;
  }

  .nfln-header {
    max-width: 700px;
    margin: 0 auto 16px;
    text-align: center;
  }

  .nfln-header h1 {
    font-size: 28px;
    margin: 0 0 5px;
    color: var(--patriots-blue);
    letter-spacing: -0.5px;
  }

  .nfln-header p {
    color: var(--muted);
    font-size: 14px;
    margin: 0;
  }

  .nfln-nav {
    max-width: 700px;
    margin: 0 auto 24px;
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .nfln-nav a {
    padding: 9px 17px;
    border-radius: 8px;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
    transition: background .18s ease, border-color .18s ease, transform .18s ease;
  }

  .nfln-nav a.active {
    background: var(--patriots-red);
    color: #fff;
    border: 1px solid var(--patriots-red);
    box-shadow: 0 3px 10px rgba(0,0,0,0.14);
  }

  .nfln-nav a.inactive {
    background: rgba(255,255,255,0.94);
    color: var(--patriots-blue);
    border: 1px solid var(--silver-dark);
  }

  .nfln-nav a.inactive:hover {
    background: var(--patriots-blue);
    color: #fff;
    border-color: var(--patriots-blue);
    transform: translateY(-1px);
  }

  .nfln-back {
    display: block;
    max-width: 700px;
    margin: 0 auto 16px;
    font-size: 14px;
  }

  .nfln-back a {
    color: #50565b;
    text-decoration: none;
  }

  .nfln-back a:hover {
    color: var(--patriots-blue);
  }

  .trade-card {
    max-width: 700px;
    margin: 0 auto;
    background: var(--patriots-blue);
    color: var(--card-text);
    border: 1px solid #173c60;
    border-radius: 14px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 7px 18px rgba(0,0,0,0.18);
  }
  .trade-card h2 { font-size: 20px; margin-bottom: 10px; color: #fff; }
  .trade-card p { font-size: 15px; color: var(--card-soft); line-height: 1.6; margin-bottom: 22px; }
  .trade-btn {
    display: inline-block;
    background: var(--patriots-red);
    color: #ffffff;
    text-decoration: none;
    padding: 12px 28px;
    border-radius: 999px;
    font-weight: bold;
    font-size: 15px;
    transition: background .18s ease, transform .18s ease;
  }
  .trade-btn:hover { background: #a80d26; transform: translateY(-1px); }
  .trade-source { margin-top: 18px; font-size: 12px; color: var(--card-soft); opacity: 0.8; }

  .trade-calculator {
    max-width: 1000px;
    margin: 0 auto;
  }

  .settings-strip {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }

  .settings-strip div {
    background: rgba(255,255,255,0.94);
    border: 1px solid var(--border);
    border-radius: 9px;
    padding: 8px 14px;
    text-align: center;
    min-width: 125px;
  }

  .settings-strip span {
    display: block;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .5px;
    color: var(--muted);
    margin-bottom: 2px;
  }

  .settings-strip strong {
    color: var(--patriots-blue);
    font-size: 14px;
  }

  .api-status {
    max-width: 1000px;
    margin: 0 auto 14px;
    padding: 10px 14px;
    border-radius: 9px;
    background: rgba(255,255,255,0.90);
    border: 1px solid var(--border);
    color: var(--muted);
    text-align: center;
    font-size: 12px;
  }

  .api-status.success {
    color: #176a3a;
    background: #edf8f1;
    border-color: #b9dfc8;
  }

  .api-status.error {
    color: #9c1c31;
    background: #fff0f2;
    border-color: #edb9c2;
  }

  .trade-sides {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }

  .trade-side {
    background: var(--patriots-blue);
    color: #fff;
    border: 1px solid #173c60;
    border-radius: 14px;
    padding: 18px;
    box-shadow: 0 7px 18px rgba(0,0,0,0.18);
    min-width: 0;
  }

  .side-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
    padding-bottom: 13px;
    margin-bottom: 13px;
  }

  .side-header h2 {
    margin: 0;
    font-size: 19px;
    color: #fff;
  }

  .side-total {
    text-align: right;
  }

  .side-total span {
    display: block;
    color: #b9c9d7;
    font-size: 10px;
    text-transform: uppercase;
  }

  .side-total strong {
    font-size: 21px;
    color: #fff;
  }

  .player-search-wrap {
    position: relative;
  }

  .player-search {
    width: 100%;
    padding: 11px 13px;
    border-radius: 9px;
    border: 1px solid #5c7893;
    background: #fff;
    color: #17212b;
    outline: none;
    font-size: 14px;
  }

  .player-search:focus {
    border-color: var(--patriots-red);
    box-shadow: 0 0 0 3px rgba(200,16,46,0.16);
  }

  .player-search:disabled {
    opacity: .65;
    cursor: wait;
  }

  .player-results {
    display: none;
    position: absolute;
    z-index: 20;
    top: calc(100% + 5px);
    left: 0;
    right: 0;
    background: #fff;
    border-radius: 9px;
    border: 1px solid #c5c9cc;
    overflow: hidden;
    box-shadow: 0 10px 24px rgba(0,0,0,0.25);
  }

  .player-result {
    width: 100%;
    border: 0;
    border-bottom: 1px solid #e5e7e9;
    background: #fff;
    padding: 10px 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    text-align: left;
    cursor: pointer;
    color: #162433;
  }

  .player-result:last-child { border-bottom: 0; }
  .player-result:hover { background: #eef2f5; }

  .player-result span {
    min-width: 0;
  }

  .player-result strong,
  .player-result small {
    display: block;
  }

  .player-result strong {
    font-size: 13px;
  }

  .player-result small {
    color: #6c7780;
    font-size: 11px;
    margin-top: 2px;
  }

  .player-result b {
    color: var(--patriots-blue);
    white-space: nowrap;
    font-size: 13px;
  }

  .no-results {
    color: #6c7780;
    padding: 11px 12px;
    font-size: 13px;
  }

  .selected-players {
    margin-top: 13px;
  }

  .empty-side {
    border: 1px dashed rgba(255,255,255,0.25);
    border-radius: 9px;
    padding: 16px 10px;
    text-align: center;
    color: #9fb0bf;
    font-size: 12px;
  }

  .selected-player {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 11px;
    margin-bottom: 7px;
    border-radius: 8px;
    background: rgba(255,255,255,0.075);
    border: 1px solid rgba(255,255,255,0.09);
  }

  .selected-player > div:first-child {
    min-width: 0;
  }

  .selected-player strong,
  .selected-player small {
    display: block;
  }

  .selected-player strong {
    color: #fff;
    font-size: 13px;
    overflow-wrap: break-word;
  }

  .selected-player small {
    color: #aebdca;
    font-size: 11px;
    margin-top: 2px;
  }

  .selected-value {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .selected-value b {
    color: #fff;
    font-size: 13px;
  }

  .remove-player {
    width: 24px;
    height: 24px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,0.10);
    color: #c6d0d9;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
  }

  .remove-player:hover {
    background: var(--patriots-red);
    color: #fff;
  }

  .trade-result {
    max-width: 600px;
    margin: 18px auto 0;
    padding: 16px 20px;
    border-radius: 12px;
    background: rgba(255,255,255,0.95);
    border: 1px solid var(--border);
    text-align: center;
    box-shadow: 0 5px 15px rgba(0,0,0,0.10);
  }

  .trade-result-label {
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .7px;
    font-size: 10px;
    margin-bottom: 5px;
  }

  #trade-result-value {
    color: var(--patriots-blue);
    font-size: 18px;
    font-weight: bold;
  }

  #trade-result-value.team1 { color: #176a3a; }
  #trade-result-value.team2 { color: var(--patriots-red); }
  #trade-result-value.even { color: var(--patriots-blue); }

  .trade-note {
    text-align: center;
    color: #5f666c;
    font-size: 11px;
    margin-top: 14px;
  }

  .trade-note a {
    color: var(--patriots-blue);
    font-weight: bold;
  }

  @media (max-width: 760px) {
    .trade-sides {
      grid-template-columns: 1fr;
    }

    .settings-strip div {
      min-width: 105px;
    }
  }

</style>
</head>
<body>

<div class="trade-calculator">
  <div class="settings-strip">
    <div><span>League</span><strong>Dynasty</strong></div>
    <div><span>Teams</span><strong>12</strong></div>
    <div><span>Scoring</span><strong>1 PPR</strong></div>
    <div><span>Format</span><strong>Superflex</strong></div>
  </div>

  <div id="api-status" class="api-status">FantasyCalc adatok betöltése…</div>

  <div class="trade-sides">
    <section class="trade-side">
      <div class="side-header">
        <h2>Team 1</h2>
        <div class="side-total"><span>Összesen</span><strong id="total1">0</strong></div>
      </div>

      <div class="player-search-wrap">
        <input id="search1" class="player-search" type="text"
               placeholder="Játékos keresése…" autocomplete="off" disabled>
        <div id="results1" class="player-results"></div>
      </div>
      <div id="players1" class="selected-players"></div>
    </section>

    <section class="trade-side">
      <div class="side-header">
        <h2>Team 2</h2>
        <div class="side-total"><span>Összesen</span><strong id="total2">0</strong></div>
      </div>

      <div class="player-search-wrap">
        <input id="search2" class="player-search" type="text"
               placeholder="Játékos keresése…" autocomplete="off" disabled>
        <div id="results2" class="player-results"></div>
      </div>
      <div id="players2" class="selected-players"></div>
    </section>
  </div>

  <div id="trade-result" class="trade-result">
    <div class="trade-result-label">Trade balance</div>
    <div id="trade-result-value">Adj játékost mindkét oldalhoz</div>
  </div>

  <div class="trade-note">
    Trade values powered by
    <a href="https://fantasycalc.com/" target="_blank" rel="noopener noreferrer">FantasyCalc</a>.
  </div>
</div>

<script>
(() => {
  const API_URL =
    "https://api.fantasycalc.com/values/current?isDynasty=true&numQbs=2&numTeams=12&ppr=1";

  let players = [];
  const selected = [[], []];

  const status = document.getElementById("api-status");

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, ch => ({
      "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;"
    }[ch]));
  }

  function teamName(player) {
    return player.maybeTeam || player.team || "";
  }

  function normalizeItems(data) {
    if (Array.isArray(data)) return data;
    if (Array.isArray(data?.items)) return data.items;
    if (Array.isArray(data?.values)) return data.values;
    if (Array.isArray(data?.data)) return data.data;
    return [];
  }

  function playerValue(item) {
    return Number(item?.value ?? item?.tradeValue ?? item?.player?.value ?? 0);
  }

  function playerInfo(item) {
    const p = item?.player || item;
    return {
      id: String(p?.id ?? p?.sleeperId ?? p?.name ?? Math.random()),
      name: p?.name || "Unknown Player",
      position: p?.position || "",
      team: p?.maybeTeam || p?.team || "",
      value: playerValue(item),
      rank: item?.overallRank ?? p?.overallRank ?? null
    };
  }

  async function loadPlayers() {
    try {
      const response = await fetch(API_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("HTTP " + response.status);

      const data = await response.json();
      players = normalizeItems(data)
        .map(playerInfo)
        .filter(p => p.name && p.value > 0)
        .sort((a, b) => (b.value - a.value) || a.name.localeCompare(b.name));

      if (!players.length) throw new Error("Az API nem adott vissza játékosokat.");

      status.textContent = `${players.length} FantasyCalc játékos betöltve • Dynasty / 12 Teams / 1 PPR / Superflex`;
      status.classList.add("success");

      document.querySelectorAll(".player-search").forEach(input => input.disabled = false);
    } catch (error) {
      console.error("FantasyCalc API:", error);
      status.textContent =
        "Nem sikerült betölteni a FantasyCalc adatokat. Ellenőrizd, hogy a GitHub Pages-ről engedélyezett-e az API-kérés.";
      status.classList.add("error");
    }
  }

  function renderResults(side, query) {
    const box = document.getElementById("results" + side);
    const q = query.trim().toLowerCase();

    if (!q) {
      box.innerHTML = "";
      box.style.display = "none";
      return;
    }

    const already = new Set(selected[side - 1].map(p => p.id));

    const matches = players
      .filter(p => !already.has(p.id))
      .filter(p =>
        p.name.toLowerCase().includes(q) ||
        p.team.toLowerCase().includes(q) ||
        p.position.toLowerCase().includes(q)
      )
      .slice(0, 8);

    if (!matches.length) {
      box.innerHTML = '<div class="no-results">Nincs találat.</div>';
      box.style.display = "block";
      return;
    }

    box.innerHTML = matches.map(p => `
      <button type="button" class="player-result"
              data-side="${side}" data-id="${esc(p.id)}">
        <span>
          <strong>${esc(p.name)}</strong>
          <small>${esc(p.position)}${p.team ? " • " + esc(p.team) : ""}</small>
        </span>
        <b>${p.value.toLocaleString("en-US")}</b>
      </button>
    `).join("");

    box.style.display = "block";
  }

  function addPlayer(side, id) {
    const index = players.findIndex(p => p.id === String(id));
    if (index < 0) return;

    if (selected[side - 1].some(p => p.id === String(id))) return;

    selected[side - 1].push(players[index]);
    document.getElementById("search" + side).value = "";
    document.getElementById("results" + side).style.display = "none";
    renderSelected(side);
    updateTotals();
  }

  function removePlayer(side, id) {
    selected[side - 1] = selected[side - 1].filter(p => p.id !== String(id));
    renderSelected(side);
    updateTotals();
  }

  function renderSelected(side) {
    const box = document.getElementById("players" + side);
    const list = selected[side - 1];

    if (!list.length) {
      box.innerHTML = '<div class="empty-side">Adj hozzá játékost a keresővel.</div>';
      return;
    }

    box.innerHTML = list.map(p => `
      <div class="selected-player">
        <div>
          <strong>${esc(p.name)}</strong>
          <small>${esc(p.position)}${p.team ? " • " + esc(p.team) : ""}</small>
        </div>
        <div class="selected-value">
          <b>${p.value.toLocaleString("en-US")}</b>
          <button type="button" class="remove-player"
                  data-side="${side}" data-id="${esc(p.id)}" aria-label="Eltávolítás">×</button>
        </div>
      </div>
    `).join("");
  }

  function updateTotals() {
    const totals = selected.map(list =>
      list.reduce((sum, p) => sum + p.value, 0)
    );

    document.getElementById("total1").textContent = totals[0].toLocaleString("en-US");
    document.getElementById("total2").textContent = totals[1].toLocaleString("en-US");

    const diff = totals[0] - totals[1];
    const result = document.getElementById("trade-result-value");

    if (!diff) {
      result.textContent = totals[0] ? "Teljesen kiegyenlített trade" : "Adj játékost mindkét oldalhoz";
      result.className = "even";
      return;
    }

    const stronger = diff > 0 ? "Team 1" : "Team 2";
    result.textContent = `${stronger} +${Math.abs(diff).toLocaleString("en-US")}`;
    result.className = diff > 0 ? "team1" : "team2";
  }

  document.addEventListener("input", event => {
    if (event.target.matches(".player-search")) {
      renderResults(Number(event.target.id.slice(-1)), event.target.value);
    }
  });

  document.addEventListener("click", event => {
    const add = event.target.closest(".player-result");
    if (add) {
      addPlayer(Number(add.dataset.side), add.dataset.id);
      return;
    }

    const remove = event.target.closest(".remove-player");
    if (remove) {
      removePlayer(Number(remove.dataset.side), remove.dataset.id);
      return;
    }

    if (!event.target.closest(".player-search-wrap")) {
      document.querySelectorAll(".player-results").forEach(box => {
        box.style.display = "none";
      });
    }
  });

  renderSelected(1);
  renderSelected(2);
  updateTotals();
  loadPlayers();
})();
</script>

</body>
</html>
