<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Games</title>
<style>
:root{--page-bg:#d5d8da;--patriots-blue:#0b2a4a;--patriots-blue-hover:#123b63;--patriots-red:#c8102e;--silver-dark:#8f959a;--text:#1a1a1a;--muted:#666c72}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 60px;font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh;background:linear-gradient(rgba(213,216,218,.94),rgba(196,200,204,.94)),repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),rgba(255,255,255,.24) calc(12.5% - 1px),rgba(255,255,255,.24) 12.5%),repeating-linear-gradient(0deg,transparent 0,transparent 92px,rgba(255,255,255,.18) 92px,rgba(255,255,255,.18) 94px);background-attachment:fixed}
.header{max-width:1000px;margin:0 auto 16px;text-align:center}.header h1{font-size:28px;margin:0 0 5px;color:var(--patriots-blue)}.header p{color:var(--muted);font-size:14px;margin:0}.back{display:block;max-width:1000px;margin:0 auto 16px;font-size:14px}.back a{color:#50565b;text-decoration:none}.back a:hover{color:var(--patriots-blue)}
.controls{max-width:1000px;margin:0 auto 22px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.controls button{border:1px solid var(--silver-dark);background:#fff;color:var(--patriots-blue);border-radius:8px;padding:9px 14px;font-weight:bold;cursor:pointer}.controls button:hover{background:var(--patriots-blue);color:#fff}.controls button.active{background:var(--patriots-red);color:#fff;border-color:var(--patriots-red)}.controls select{border:1px solid var(--silver-dark);border-radius:8px;background:#fff;padding:9px 12px;font-size:14px}.timezone-group{display:flex;align-items:center;gap:6px;margin-left:8px;padding-left:8px;border-left:1px solid #c5c9cc}.timezone-label{font-size:12px;font-weight:bold;color:var(--muted);white-space:nowrap}.timezone-group button{padding:9px 12px}.status{max-width:1000px;margin:0 auto 14px;text-align:center;color:var(--muted);font-size:13px}.games{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.game{background:var(--patriots-blue);color:#fff;border:1px solid #173c60;border-radius:10px;padding:17px 18px;box-shadow:0 7px 18px rgba(0,0,0,.18)}.game-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:#d5dfe8}.badge{font-weight:bold;padding:4px 9px;border-radius:999px;background:#fff;color:var(--patriots-blue)}.teams{display:grid;gap:8px}.team{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:bold}.team-left{display:flex;align-items:center;gap:9px}.abbr{display:inline-flex;min-width:38px;justify-content:center;font-size:12px;color:#d5dfe8}.score{font-size:19px}.venue{border-top:1px solid rgba(255,255,255,.14);margin-top:14px;padding-top:10px;font-size:12px;color:#d5dfe8;line-height:1.45}.empty,.error{max-width:700px;margin:30px auto;text-align:center;background:#fff;border-radius:10px;padding:18px;color:var(--muted)}.error{color:#b42318}@media(max-width:700px){.games{grid-template-columns:1fr}.timezone-group{margin-left:0;padding-left:0;border-left:0;width:100%;justify-content:center}}
</style>

<style id="site-navigation-layout-fix-nfl-games">
.nfln-nav { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0 0 18px; }
.nfln-nav a { display: block; text-align: center; }
@media (max-width: 900px) { .nfln-nav { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .nfln-nav { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="back"><a href="index.html">&larr; Back to Players Trending</a></div>
<div class="header"><h1>NFL Games</h1><p>Real NFL game data from ESPN</p></div>
<nav class="nfln-nav" aria-label="Site navigation">
  <a href="index.html" class="inactive">Players Trending</a>
  <a href="trade-chart.html" class="inactive">Dynasty Trade Calculator</a>
  <a href="rookie-idp-rankings.html" class="inactive">IDP Rankings (Rookies)</a>
  <a href="tips.html" class="inactive">Tips</a>
  <a href="bye-weeks.html" class="inactive">Bye Weeks</a>
  <a href="my-team.html" class="inactive">My Fantasy Team</a>
  <a href="strength-of-schedule.html" class="inactive">Strength of Schedule</a>
  <a href="IDP26rankings.html" class="inactive">2026 IDP Rankings</a>
  <a href="nfl-games.html" class="active">NFL Games</a>
</nav>
<div class="controls">
<button id="prev">&larr; Previous week</button>
<select id="week" aria-label="NFL week"></select>
<button id="next">Next week &rarr;</button>
<div class="timezone-group" role="group" aria-label="Game time zone">
  <span class="timezone-label">Game time:</span>
  <button id="tz-hu" type="button">Hungary Time</button>
  <button id="tz-et" type="button">US Eastern</button>
</div>
</div>
<div id="status" class="status">Loading...</div>
<div id="games" class="games"></div>
<script src="nfl-games.js"></script>
<script>
(function(){
  const data=window.NFLGamesData;
  const weekSelect=document.getElementById('week');
  const gamesEl=document.getElementById('games');
  const statusEl=document.getElementById('status');
  const tzHuButton=document.getElementById('tz-hu');
  const tzEtButton=document.getElementById('tz-et');
  const TIMEZONES={HU:'Europe/Budapest',ET:'America/New_York'};
  const TIMEZONE_LABELS={HU:'HU',ET:'ET'};
  let currentWeek=1;
  let currentTimezone='HU';
  let currentGames=[];
  for(let i=1;i<=18;i++){const option=document.createElement('option');option.value=String(i);option.textContent='Week '+i;weekSelect.appendChild(option)}
  weekSelect.value=String(currentWeek);

  function updateTimezoneButtons(){
    tzHuButton.classList.toggle('active',currentTimezone==='HU');
    tzEtButton.classList.toggle('active',currentTimezone==='ET');
    tzHuButton.setAttribute('aria-pressed',String(currentTimezone==='HU'));
    tzEtButton.setAttribute('aria-pressed',String(currentTimezone==='ET'));
  }

  function formatKickoff(utc){
    if(!utc)return 'Time unavailable';
    const date=new Date(utc);
    if(Number.isNaN(date.getTime()))return 'Time unavailable';
    const formatted=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:TIMEZONES[currentTimezone]}).format(date);
    return formatted+' · '+TIMEZONE_LABELS[currentTimezone];
  }

  function render(games){
    gamesEl.innerHTML='';
    if(!games.length){gamesEl.innerHTML='<div class="empty">No games found for this week.</div>';return}
    games.forEach(game=>{
      const card=document.createElement('article');card.className='game';
      const home=game.homeTeam, away=game.awayTeam;
      const venue=game.venue;
      const venueText=venue?[venue.name,venue.city,venue.state||venue.country].filter(Boolean).join(', '):'Venue unavailable';
      card.innerHTML=`<div class="game-top"><span>${formatKickoff(game.kickoffUtc)}</span><span class="badge">${game.status.category}</span></div><div class="teams"><div class="team"><span class="team-left"><span class="abbr">${away.abbreviation||''}</span>${away.name||'Unknown team'}</span><span class="score">${away.score??''}</span></div><div class="team"><span class="team-left"><span class="abbr">${home.abbreviation||''}</span>${home.name||'Unknown team'}</span><span class="score">${home.score??''}</span></div></div><div class="venue">${venueText}${game.neutralSite?' · Neutral site':''}</div>`;
      gamesEl.appendChild(card);
    });
  }

  async function loadWeek(week){
    currentWeek=week;weekSelect.value=String(week);statusEl.textContent='Loading Week '+week+'...';gamesEl.innerHTML='';
    try{const response=await fetch(data.buildEspnWeekUrl(week),{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const raw=await response.json();currentGames=data.normalizeEspnScoreboard(raw);render(currentGames);statusEl.textContent='Week '+week+' · '+currentGames.length+' games';}
    catch(error){statusEl.textContent='Could not load Week '+week;gamesEl.innerHTML='<div class="error">The NFL game data could not be loaded right now.</div>';console.error(error)}
  }

  function setTimezone(timezoneKey){
    if(!TIMEZONES[timezoneKey]||currentTimezone===timezoneKey)return;
    currentTimezone=timezoneKey;
    updateTimezoneButtons();
    render(currentGames);
  }

  document.getElementById('prev').addEventListener('click',()=>{if(currentWeek>1)loadWeek(currentWeek-1)});
  document.getElementById('next').addEventListener('click',()=>{if(currentWeek<18)loadWeek(currentWeek+1)});
  weekSelect.addEventListener('change',()=>loadWeek(Number(weekSelect.value)));
  tzHuButton.addEventListener('click',()=>setTimezone('HU'));
  tzEtButton.addEventListener('click',()=>setTimezone('ET'));

  updateTimezoneButtons();
  loadWeek(currentWeek);
})();
</script>
</body>
</html>
