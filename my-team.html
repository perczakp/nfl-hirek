<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Fantasy Team</title>
</head>
<body>
<script>
(function(){
  "use strict";
  var src="./my-team.backup-20260907-2235.html?ts="+Date.now();
  fetch(src,{cache:"no-store"})
    .then(function(r){
      if(!r.ok) throw new Error("My Team source HTTP "+r.status);
      return r.text();
    })
    .then(function(html){
      document.open();
      document.write(html);
      document.close();
    })
    .catch(function(err){
      document.body.innerHTML='<div style="font-family:Arial;padding:24px;color:#9c2b2b">My Team betöltési hiba: '+String(err.message||err)+'</div>';
      console.error(err);
    });
})();
</script>
</body>
</html>
