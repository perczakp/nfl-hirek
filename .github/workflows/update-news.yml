name: NFL hírek frissítése

on:
  schedule:
    # Naponta 04:00 UTC = 06:00 magyar idő (nyáron CEST)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Repository klónozása
        uses: actions/checkout@v4

      - name: Node.js beállítása
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Hírek frissítése
        run: node update-news.js

      - name: Tippek frissítése
        run: node update-tips.js

      - name: Változások mentése a repository-ba
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json players.json player-news.json tips.json
          git diff --staged --quiet || git commit -m "Hírek és tippek automatikus frissítése"
          git push
