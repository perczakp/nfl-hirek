name: NFL Nav Migration

on: [workflow_dispatch]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run migration
        run: python .github/scripts/migrate_nfl_navigation.py

      - name: Commit migration and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html trade-chart.html rookie-idp-rankings.html tips.html bye-weeks.html my-team.html strength-of-schedule.html IDP26rankings.html nfl-games.html PROJECT_STATE.md
          git rm .github/scripts/migrate_nfl_navigation.py .github/workflows/nfl-nav-migration.yml
          git diff --cached --check
          git commit -m "Add NFL Games to main navigation"
          git push origin HEAD:main
