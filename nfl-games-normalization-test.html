<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFL Games Normalization Test</title>
</head>
<body>
  <h1>NFL Games Normalization Test</h1>
  <pre id="output">Testing...</pre>

  <script src="nfl-games.js"></script>
  <script>
    const output = document.getElementById("output");

    async function runTest(name, url) {
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) {
        throw new Error(`${name}: HTTP ${response.status}`);
      }
      const raw = await response.json();
      const games = window.NFLGamesData.normalizeEspnScoreboard(raw);

      return {
        name,
        status: response.status,
        rawEvents: Array.isArray(raw.events) ? raw.events.length : 0,
        normalizedGames: games.length,
        firstGame: games[0] || null,
        allGamesHaveRequiredFields: games.every((game) =>
          Boolean(game.id && game.kickoffUtc && game.homeTeam?.name && game.awayTeam?.name)
        )
      };
    }

    (async () => {
      try {
        const results = [];
        results.push(await runTest(
          "week",
          window.NFLGamesData.buildEspnWeekUrl(1)
        ));
        results.push(await runTest(
          "date",
          window.NFLGamesData.buildEspnDateUrl("20260910")
        ));

        output.textContent = JSON.stringify({
          origin: location.origin,
          results
        }, null, 2);
      } catch (error) {
        output.textContent = JSON.stringify({
          origin: location.origin,
          error: String(error)
        }, null, 2);
      }
    })();
  </script>
</body>
</html>
