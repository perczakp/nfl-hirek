name: One-time add NFL Games navigation

on:
  push:
    paths:
      - .github/workflows/one-time-add-nfl-games-navigation.yml

permissions:
  contents: write

jobs:
  update-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update site-wide navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          pages = [
              'index.html',
              'trade-chart.html',
              'rookie-idp-rankings.html',
              'tips.html',
              'bye-weeks.html',
              'my-team.html',
              'strength-of-schedule.html',
              'IDP26rankings.html',
          ]

          labels = [
              ('index.html', 'Players Trending'),
              ('trade-chart.html', 'Dynasty Trade Calculator'),
              ('rookie-idp-rankings.html', 'IDP Rankings (Rookies)'),
              ('tips.html', 'Tips'),
              ('bye-weeks.html', 'Bye Weeks'),
              ('my-team.html', 'My Fantasy Team'),
              ('strength-of-schedule.html', 'Strength of Schedule'),
              ('IDP26rankings.html', '2026 IDP Rankings'),
              ('nfl-games.html', 'NFL Games'),
          ]

          def nav_markup(active_path, tag='div', cls='nfln-nav'):
              links = []
              for path, label in labels:
                  state = 'active' if path == active_path else 'inactive'
                  links.append(f'    <a href="{path}" class="{state}">{label}</a>')
              if tag == 'nav':
                  return '<nav class="nav">\n' + '\n'.join(links) + '\n</nav>'
              return '<div class="nfln-nav">\n' + '\n'.join(links) + '\n  </div>'

          for page in pages:
              path = Path(page)
              text = path.read_text(encoding='utf-8')
              if page == 'my-team.html':
                  pattern = r'<nav class="nav">.*?</nav>'
                  replacement = nav_markup(page, tag='nav', cls='nav')
              else:
                  pattern = r'<div class="nfln-nav">.*?</div>'
                  replacement = nav_markup(page)
              updated, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'Navigation block not found exactly once in {page}')
              path.write_text(updated, encoding='utf-8')

          games = Path('nfl-games.html')
          text = games.read_text(encoding='utf-8')
          nav_css = '''\n<style id="site-navigation-layout-fix-v3">\n.nfln-nav{display:grid;grid-template-columns:repeat(3,max-content);justify-content:center;align-items:center;gap:8px;width:100%;max-width:900px;margin:0 auto 24px;box-sizing:border-box;overflow:visible;white-space:normal}\n.nfln-nav a{display:block;width:max-content;min-width:0;padding:9px 17px;border:1px solid var(--silver-dark);border-radius:8px;color:var(--patriots-blue);background:rgba(255,255,255,.94);font-size:14px;font-weight:bold;text-align:center;text-decoration:none;transition:background .18s ease,border-color .18s ease,transform .18s ease;box-sizing:border-box;white-space:nowrap}.nfln-nav a.active{color:#fff;background:var(--patriots-red);border-color:var(--patriots-red);box-shadow:0 3px 10px rgba(0,0,0,.14)}.nfln-nav a.inactive:hover{color:#fff;background:var(--patriots-blue);border-color:var(--patriots-blue);transform:translateY(-1px)}\n@media(max-width:760px){.nfln-nav{grid-template-columns:repeat(2,max-content)}}\n@media(max-width:500px){.nfln-nav{grid-template-columns:1fr}.nfln-nav a{width:100%}}\n</style>\n'''
          if 'id="site-navigation-layout-fix-v3"' not in text:
              text = text.replace('</head>', nav_css + '</head>', 1)
          games_nav = nav_markup('nfl-games.html')
          marker = '<div class="header"><h1>NFL Games</h1><p>Real NFL game data from ESPN</p></div>'
          if marker not in text:
              raise SystemExit('NFL Games header marker not found')
          text = text.replace(marker, marker + '\n' + games_nav, 1)
          games.write_text(text, encoding='utf-8')

          state = Path('PROJECT_STATE.md')
          s = state.read_text(encoding='utf-8')
          s = s.replace(
              '8. 2026 IDP Rankings\n\nPlanned:\n9. Preseason',
              '8. 2026 IDP Rankings\n9. NFL Games\n\nPlanned:\n10. Preseason',
              1,
          )
          s = s.replace(
              '- `strength-of-schedule.html`\n- `fantasycalc-values.json`',
              '- `strength-of-schedule.html`\n- `nfl-games.html`\n- `nfl-games.js`\n- `fantasycalc-values.json`',
              1,
          )
          s = s.replace(
              '## 18. Planned Preseason tab',
              '## 18. NFL Games\n`nfl-games.html` is the live NFL schedule/game page using direct ESPN scoreboard data and the normalized game layer in `nfl-games.js`.\n\nRuntime validation completed on 2026-09-09 confirmed regular-season week and date requests return real ESPN game data and normalize successfully. The page is now part of the site-wide main navigation.\n\n## 19. Planned Preseason tab',
              1,
          )
          s = s.replace('## 19. FantasyPros reference work', '## 20. FantasyPros reference work', 1)
          s = s.replace('## 20. Lessons from FantasyPros comparison', '## 21. Lessons from FantasyPros comparison', 1)
          s = s.replace('## 21. Site-wide navigation rule', '## 22. Site-wide navigation rule', 1)
          s = s.replace('## 22. Mandatory pre-change audit', '## 23. Mandatory pre-change audit', 1)
          s = s.replace('## 23. Backup-first rule', '## 24. Backup-first rule', 1)
          s = s.replace('## 24. Minimal-change and verification rule', '## 25. Minimal-change and verification rule', 1)
          s = s.replace(
              '- Do not fix a complex subsystem piecemeal without first auditing its end-to-end data flow.',
              '- Do not fix a complex subsystem piecemeal without first auditing its end-to-end data flow.\n- Do not add a navigation item to only one page; site-wide navigation changes must be synchronized across all production pages.',
              1,
          )
          changelog = '''## 2026-09-09\n- Added the validated NFL Games page to the site-wide main navigation as the ninth current tab.\n- Documented the direct ESPN scoreboard source and normalized game-data layer.\n- Confirmed Preseason remains planned but is not the current priority.\n\n'''
          s = s.replace('# CHANGELOG\n', '# CHANGELOG\n\n' + changelog, 1)
          state.write_text(s, encoding='utf-8')

      - name: Verify navigation consistency
        shell: python
        run: |
          from pathlib import Path
          import re

          expected = [
              'index.html', 'trade-chart.html', 'rookie-idp-rankings.html', 'tips.html',
              'bye-weeks.html', 'my-team.html', 'strength-of-schedule.html',
              'IDP26rankings.html', 'nfl-games.html'
          ]
          for page in expected:
              text = Path(page).read_text(encoding='utf-8')
              block = re.search(r'<(?:div class="nfln-nav"|nav class="nav").*?</(?:div|nav)>', text, re.S)
              if not block:
                  raise SystemExit(f'No navigation block found in {page}')
              for href in expected:
                  if f'href="{href}"' not in block.group(0):
                      raise SystemExit(f'{page}: missing {href}')
          print('Navigation verification passed for all 9 production pages.')

      - name: Commit production change and remove one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-time-add-nfl-games-navigation.yml
          git add index.html trade-chart.html rookie-idp-rankings.html tips.html bye-weeks.html my-team.html strength-of-schedule.html IDP26rankings.html nfl-games.html PROJECT_STATE.md
          git commit -m "Add NFL Games to site-wide navigation"
          git push
