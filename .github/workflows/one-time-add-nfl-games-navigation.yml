name: One-time NFL Games navigation integration

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate-navigation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch navigation and verify
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess

          repo_root = Path.cwd()
          backup_ref = "origin/backup-20260909-before-nfl-games-navigation"

          pages = [
              "index.html",
              "trade-chart.html",
              "rookie-idp-rankings.html",
              "tips.html",
              "bye-weeks.html",
              "my-team.html",
              "strength-of-schedule.html",
              "IDP26rankings.html",
              "nfl-games.html",
          ]

          canonical_links = {
              "index.html": "Players Trending",
              "trade-chart.html": "Dynasty Trade Calculator",
              "rookie-idp-rankings.html": "IDP Rankings (Rookies)",
              "tips.html": "Tips",
              "bye-weeks.html": "Bye Weeks",
              "my-team.html": "My Fantasy Team",
              "strength-of-schedule.html": "Strength of Schedule",
              "IDP26rankings.html": "2026 IDP Rankings",
              "nfl-games.html": "NFL Games",
          }

          subprocess.run(["git", "fetch", "origin", "backup-20260909-before-nfl-games-navigation"], check=True)
          result = subprocess.run(
              ["git", "diff", "--quiet", backup_ref, "--", *pages],
              check=False,
          )
          if result.returncode != 0:
              raise SystemExit("ABORTED: production pages differ from the verified backup branch. No navigation changes were made.")

          def nav_html(active, wrapper="div"):
              lines = [f'<{wrapper} class="nfln-nav">']
              for href, label in canonical_links.items():
                  cls = ' class="active"' if href == active else " class=\"inactive\""
                  lines.append(f'  <a href="{href}"{cls}>{label}</a>')
              lines.append(f"</{wrapper}>")
              return "\n".join(lines)

          # Patch the eight existing navigation blocks. Preserve each page's
          # existing wrapper type (div/nav) so the migration is structural-only.
          for page in pages[:8]:
              path = repo_root / page
              text = path.read_text(encoding="utf-8")
              if page == "my-team.html":
                  pattern = re.compile(r'<nav\s+class=["\']nav["\'][^>]*>.*?</nav>', re.S | re.I)
              else:
                  pattern = re.compile(r'<(?:div|nav)\s+class=["\']nfln-nav["\'][^>]*>.*?</(?:div|nav)>', re.S | re.I)

              matches = list(pattern.finditer(text))
              if len(matches) != 1:
                  raise SystemExit(f"ABORTED: expected exactly one navigation block in {page}, found {len(matches)}")

              opening = matches[0].group(0).split(">", 1)[0].lower()
              wrapper = "nav" if opening.startswith("<nav") else "div"
              replacement = nav_html(page, wrapper)
              text = pattern.sub(replacement, text, count=1)
              path.write_text(text, encoding="utf-8")

          # Add the same navigation to nfl-games.html, with responsive layout CSS.
          nfl_path = repo_root / "nfl-games.html"
          text = nfl_path.read_text(encoding="utf-8")
          if re.search(r'<(?:div|nav)\s+class=["\']nfln-nav["\']', text, re.I):
              raise SystemExit("ABORTED: nfl-games.html already contains an NFL navigation block")

          nav = nav_html("nfl-games.html", "nav")
          css = '''
<style id="site-navigation-layout-fix-nfl-games">
.nfln-nav {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
  margin: 0 0 18px;
}
.nfln-nav a {
  display: block;
  text-align: center;
}
@media (max-width: 900px) {
  .nfln-nav {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
@media (max-width: 600px) {
  .nfln-nav {
    grid-template-columns: 1fr;
  }
}
</style>
'''

          if "site-navigation-layout-fix-nfl-games" not in text:
              if "</head>" not in text:
                  raise SystemExit("ABORTED: could not find </head> in nfl-games.html")
              text = text.replace("</head>", css + "</head>", 1)

          insertion_markers = ["<main", '<div class="container">', '<div class="controls">']
          inserted = False
          for marker in insertion_markers:
              if marker in text:
                  text = text.replace(marker, nav + "\n" + marker, 1)
                  inserted = True
                  break
          if not inserted:
              raise SystemExit("ABORTED: could not find a safe insertion point for navigation in nfl-games.html")
          nfl_path.write_text(text, encoding="utf-8")

          # Update PROJECT_STATE.md.
          state_path = repo_root / "PROJECT_STATE.md"
          state = state_path.read_text(encoding="utf-8")
          heading = "## 2026-09-09 — NFL Games navigation integration"
          if heading not in state:
              section = f'''\n\n{heading}\n- Integrated **NFL Games** into the main site navigation across all 9 production pages.\n- Synchronized navigation order across every page; **Preseason** remains excluded.\n- Set the active navigation state to the current page on each page.\n- Added responsive 3-column / 2-column / 1-column navigation behavior to `nfl-games.html`.\n- No NFL Games data source, ESPN endpoint, normalization logic, or existing page functionality was changed.\n'''
              state_path.write_text(state.rstrip() + section, encoding="utf-8")

          # Final verification: inspect only the actual navigation block.
          expected_hrefs = list(canonical_links.keys())
          for page in pages:
              text = (repo_root / page).read_text(encoding="utf-8")
              matches = list(re.finditer(r'<(?:div|nav)\s+class=["\']nfln-nav["\'][^>]*>.*?</(?:div|nav)>', text, re.S | re.I))
              if page == "my-team.html" and not matches:
                  matches = list(re.finditer(r'<nav\s+class=["\']nav["\'][^>]*>.*?</nav>', text, re.S | re.I))
              if len(matches) != 1:
                  raise SystemExit(f"VERIFICATION FAILED: expected one site navigation block in {page}, found {len(matches)}")

              nav_block = matches[0].group(0)
              actual_hrefs = re.findall(r'<a\s+href=["\']([^"\']+)["\']', nav_block, re.I)
              if actual_hrefs != expected_hrefs:
                  raise SystemExit(f"VERIFICATION FAILED: navigation order/links incorrect in {page}: {actual_hrefs}")
              if "Preseason" in nav_block:
                  raise SystemExit(f"VERIFICATION FAILED: Preseason detected in navigation of {page}")

              active_hrefs = re.findall(r'<a\s+href=["\']([^"\']+)["\']\s+class=["\']active["\']', nav_block, re.I)
              expected_active = page
              if active_hrefs != [expected_active]:
                  raise SystemExit(f"VERIFICATION FAILED: active navigation state incorrect in {page}: {active_hrefs}")

          print("Navigation migration and verification completed successfully.")
          PY

      - name: Commit production migration and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html trade-chart.html rookie-idp-rankings.html tips.html bye-weeks.html my-team.html strength-of-schedule.html IDP26rankings.html nfl-games.html PROJECT_STATE.md
          git rm .github/workflows/one-time-add-nfl-games-navigation.yml
          git diff --cached --check
          git diff --cached --name-status
          git commit -m "Add NFL Games to main navigation"
          git push origin HEAD:main
