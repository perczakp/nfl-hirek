<!DOCTYPE html>

<body>
<script>
(function(){
  var backup="./my-team.backup-20260907-1846.html?ts="+Date.now();
  fetch(backup,{cache:"no-store"}).then(function(r){
    if(!r.ok)throw new Error("Backup betöltési hiba: "+r.status);
    return r.text();
  }).then(function(html){
    var oldStarter='function renderStarterSlots(container,starterIds){var slots=(state.league&&Array.isArray(state.league.roster_positions)?state.league.roster_positions:[]).map(function(x){return String(x).toUpperCase()});var playersById={};state.rosterPlayers.forEach(function(p){playersById[String(p.id)]=p});var section=document.createElement("div");section.className="nfln-roster-section";var h=document.createElement("h3");h.innerHTML="Starter <span class=\\"nfln-section-count\\">"+slots.length+" slot</span>";section.appendChild(h);var grid=document.createElement("div");grid.className="nfln-roster";slots.forEach(function(slot,index){var id=starterIds[index];var player=id&&String(id)!=="0"?playersById[String(id)]:null;grid.appendChild(rosterPlayerCard(player,"STARTER",slot))});if(!slots.length)grid.appendChild(document.createTextNode("A Sleeper roster slotok nem érhetők el."));section.appendChild(grid);container.appendChild(section)}';
    var newStarter='function renderStarterSlots(container,starterIds){var slots=(state.league&&Array.isArray(state.league.roster_positions)?state.league.roster_positions:[]).map(function(x){return String(x).toUpperCase()}).filter(function(x){return x!=="BN"});var playersById={};state.rosterPlayers.forEach(function(p){playersById[String(p.id)]=p});var section=document.createElement("div");section.className="nfln-roster-section";var h=document.createElement("h3");h.innerHTML="Starter <span class=\\"nfln-section-count\\">"+slots.length+" slot</span>";section.appendChild(h);var grid=document.createElement("div");grid.className="nfln-roster";slots.forEach(function(slot,index){var id=starterIds[index];var player=id&&String(id)!=="0"?playersById[String(id)]:null;grid.appendChild(rosterPlayerCard(player,"STARTER",slot))});if(!slots.length)grid.appendChild(document.createTextNode("A Sleeper roster slotok nem érhetők el."));section.appendChild(grid);container.appendChild(section)}';
    var oldRoster='function renderRoster(){var box=$("roster-grid");box.innerHTML="";var taxiIds=(state.roster&&Array.isArray(state.roster.taxi)?state.roster.taxi:[]).map(String);var starterIds=(state.roster&&Array.isArray(state.roster.starters)?state.roster.starters:[]).map(String);var taxiSet={};taxiIds.forEach(function(id){taxiSet[id]=true});var starterSet={};starterIds.forEach(function(id){starterSet[id]=true});renderStarterSlots(box,starterIds);var bench=[],taxi=[];state.rosterPlayers.forEach(function(item){var id=String(item.id);if(taxiSet[id])taxi.push(item);else if(!starterSet[id])bench.push(item)});bench.sort(function(a,b){return playerName(a).localeCompare(playerName(b))});taxi.sort(function(a,b){return playerName(a).localeCompare(playerName(b))});renderRosterSection(box,"Bench",bench,"BENCH");renderRosterSection(box,"Taxi Squad",taxi,"TAXI SQUAD")}';
    var newRoster='function renderRoster(){var box=$("roster-grid");box.innerHTML="";var taxiIds=(state.roster&&Array.isArray(state.roster.taxi)?state.roster.taxi:[]).map(String);var allStarterIds=(state.roster&&Array.isArray(state.roster.starters)?state.roster.starters:[]).map(String);var starterSlots=(state.league&&Array.isArray(state.league.roster_positions)?state.league.roster_positions:[]).map(function(x){return String(x).toUpperCase()}).filter(function(x){return x!=="BN"});var starterIds=allStarterIds.slice(0,starterSlots.length);var taxiSet={};taxiIds.forEach(function(id){taxiSet[id]=true});var starterSet={};starterIds.forEach(function(id){if(id)starterSet[id]=true});renderStarterSlots(box,starterIds);var bench=[],taxi=[];state.rosterPlayers.forEach(function(item){var id=String(item.id);if(taxiSet[id])taxi.push(item);else if(!starterSet[id])bench.push(item)});bench.sort(function(a,b){return playerName(a).localeCompare(playerName(b))});taxi.sort(function(a,b){return playerName(a).localeCompare(playerName(b))});renderRosterSection(box,"Bench",bench,"BENCH");renderRosterSection(box,"Taxi Squad",taxi,"TAXI SQUAD")}';
    if(html.indexOf(oldStarter)<0||html.indexOf(oldRoster)<0)throw new Error("A várt roster kódrészlet nem található a backupban.");
    html=html.replace(oldStarter,newStarter).replace(oldRoster,newRoster);
    document.open();document.write(html);document.close();
  }).catch(function(err){document.body.innerHTML="<p>Nem sikerült betölteni a My Fantasy Team oldalt.</p><p>"+String(err.message||err)+"</p>";});
})();
</script>
</body>
</html>
