<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFL Games</title>
<style>
:root{--page-bg:#d5d8da;--patriots-blue:#0b2a4a;--patriots-blue-hover:#123b63;--patriots-red:#c8102e;--silver-dark:#8f959a;--text:#1a1a1a;--muted:#666c72}
*{box-sizing:border-box}body{margin:0;padding:24px 16px 60px;font-family:Arial,Helvetica,sans-serif;color:var(--text);min-height:100vh;background:linear-gradient(rgba(213,216,218,.94),rgba(196,200,204,.94)),repeating-linear-gradient(90deg,transparent 0,transparent calc(12.5% - 1px),rgba(255,255,255,.24) calc(12.5% - 1px),rgba(255,255,255,.24) 12.5%),repeating-linear-gradient(0deg,transparent 0,transparent 92px,rgba(255,255,255,.18) 92px,rgba(255,255,255,.18) 94px);background-attachment:fixed}
.header{max-width:1000px;margin:0 auto 16px;text-align:center}.header h1{font-size:28px;margin:0 0 5px;color:var(--patriots-blue)}.header p{color:var(--muted);font-size:14px;margin:0}.back{display:block;max-width:1000px;margin:0 auto 16px;font-size:14px}.back a{color:#50565b;text-decoration:none}.back a:hover{color:var(--patriots-blue)}
.controls{max-width:1000px;margin:0 auto 22px;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap}.controls button{border:1px solid var(--silver-dark);background:#fff;color:var(--patriots-blue);border-radius:8px;padding:9px 14px;font-weight:bold;cursor:pointer}.controls button:hover{background:var(--patriots-blue);color:#fff}.controls button.active{background:var(--patriots-red);color:#fff;border-color:var(--patriots-red)}.controls select{border:1px solid var(--silver-dark);border-radius:8px;background:#fff;padding:9px 12px;font-size:14px}.timezone-group{display:flex;align-items:center;gap:6px;margin-left:8px;padding-left:8px;border-left:1px solid #c5c9cc}.timezone-label{font-size:12px;font-weight:bold;color:var(--muted);white-space:nowrap}.timezone-group button{padding:9px 12px}.status{max-width:1000px;margin:0 auto 14px;text-align:center;color:var(--muted);font-size:13px}.status.error{color:#b42318;font-weight:bold}.status.stale{color:#9a6700;font-weight:bold}.games{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.game-day{grid-column:1/-1}.game-day-title{margin:0 0 8px;color:var(--patriots-blue);font-size:15px;font-weight:bold}.game-day-games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.game{background:var(--patriots-blue);color:#fff;border:1px solid #173c60;border-radius:10px;padding:17px 18px;box-shadow:0 7px 18px rgba(0,0,0,.18);min-width:0}.game-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;font-size:12px;color:#d5dfe8;flex-wrap:wrap}.badge{font-weight:bold;padding:4px 9px;border-radius:999px;background:#fff;color:var(--patriots-blue);white-space:nowrap}.teams{display:grid;gap:8px}.team{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:16px;font-weight:bold;min-width:0}.team-left{display:flex;align-items:center;gap:9px;min-width:0;overflow-wrap:anywhere}.abbr{display:inline-flex;min-width:38px;justify-content:center;font-size:12px;color:#d5dfe8;flex-shrink:0}.score{font-size:19px;flex-shrink:0}.venue{border-top:1px solid rgba(255,255,255,.14);margin-top:14px;padding-top:10px;font-size:12px;color:#d5dfe8;line-height:1.45;overflow-wrap:anywhere}.empty,.error{max-width:700px;margin:30px auto;text-align:center;background:#fff;border-radius:10px;padding:18px;color:var(--muted)}.error{color:#b42318}@media(max-width:700px){body{padding:18px 12px 48px}.header h1{font-size:25px}.controls{align-items:stretch}.controls>button,.controls>select{flex:1 1 calc(50% - 5px);min-width:0}.timezone-group{margin-left:0;padding-left:0;border-left:0;width:100%;justify-content:center;flex-wrap:wrap}.timezone-group button{flex:1 1 0;min-width:120px}.games{grid-template-columns:1fr}.game-day-games{grid-template-columns:1fr}.game{padding:15px}.game-top{align-items:flex-start}}@media(max-width:420px){.controls>button,.controls>select{flex-basis:100%;width:100%}.timezone-group{display:grid;grid-template-columns:1fr 1fr}.timezone-label{grid-column:1/-1;text-align:center}.timezone-group button{min-width:0;width:100%}.game{padding:14px}.team{font-size:15px}.score{font-size:18px}}
</style>

<style id="site-navigation-layout-fix-nfl-games">
.nfln-nav { max-width: 1000px; margin: 0 auto 24px; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; }
.nfln-nav a { padding: 9px 17px; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold; transition: background .18s ease, border-color .18s ease, transform .18s ease; }
.nfln-nav a.active { background: var(--patriots-red); color: #fff; border: 1px solid var(--patriots-red); box-shadow: 0 3px 10px rgba(0,0,0,0.14); }
.nfln-nav a.inactive { background: rgba(255,255,255,0.94); color: var(--patriots-blue); border: 1px solid var(--silver-dark); }
.nfln-nav a.inactive:hover { background: var(--patriots-blue); color: #fff; border-color: var(--patriots-blue); transform: translateY(-1px); }
</style>
</head>
<body>
<div class="back"><a href="index.html">&larr; Back to Players Trending</a></div>
<div class="header"><h1>NFL Games</h1><p>Real NFL game data from ESPN</p></div>
<nav class="nfln-nav" aria-label="Site navigation">
  <a href="index.html" class="inactive">Players Trending</a>
  <a href="trade-chart.html" class="inactive">Dynasty Trade Calculator</a>
  <a href="rookie-idp-rankings.html" class="inactive">IDP Rankings (Rookies)</a>
  <a href="tips.html" class="inactive">Tips</a>
  <a href="bye-weeks.html" class="inactive">Bye Weeks</a>
  <a href="my-team.html" class="inactive">My Fantasy Team</a>
  <a href="strength-of-schedule.html" class="inactive">Strength of Schedule</a>
  <a href="IDP26rankings.html" class="inactive">2026 IDP Rankings</a>
  <a href="nfl-games.html" class="active">NFL Games</a>
</nav>
<div class="controls">
<button id="prev">&larr; Previous week</button>
<select id="week" aria-label="NFL week"></select>
<button id="next">Next week &rarr;</button>
<div class="timezone-group" role="group" aria-label="Game time zone">
  <span class="timezone-label">Game time:</span>
  <button id="tz-hu" type="button">Hungary Time</button>
  <button id="tz-et" type="button">US Eastern</button>
</div>
</div>
<div id="status" class="status">Loading...</div>
<div id="games" class="games"></div>
<script src="nfl-games.js"></script>
<script>
(function(){
  const data=window.NFLGamesData;
  const weekSelect=document.getElementById('week');
  const gamesEl=document.getElementById('games');
  const statusEl=document.getElementById('status');
  const tzHuButton=document.getElementById('tz-hu');
  const tzEtButton=document.getElementById('tz-et');
  const TIMEZONES={HU:'Europe/Budapest',ET:'America/New_York'};
  const TIMEZONE_LABELS={HU:'HU',ET:'ET'};
  const AUTO_REFRESH_MS={pre:300000,live:45000};
  let currentWeek=1;
  let currentTimezone='HU';
  let currentGames=[];
  let lastSuccessfulWeek=null;
  let refreshTimer=null;
  let activeController=null;
  let loadRequestId=0;
  for(let i=1;i<=18;i++){const option=document.createElement('option');option.value=String(i);option.textContent='Week '+i;weekSelect.appendChild(option)}
  weekSelect.value=String(currentWeek);

  function setStatus(message,tone='normal'){
    statusEl.textContent=message;
    statusEl.classList.toggle('error',tone==='error');
    statusEl.classList.toggle('stale',tone==='stale');
  }

  function updateTimezoneButtons(){
    tzHuButton.classList.toggle('active',currentTimezone==='HU');
    tzEtButton.classList.toggle('active',currentTimezone==='ET');
    tzHuButton.setAttribute('aria-pressed',String(currentTimezone==='HU'));
    tzEtButton.setAttribute('aria-pressed',String(currentTimezone==='ET'));
  }

  function formatKickoff(utc){
    if(!utc)return 'Time unavailable';
    const date=new Date(utc);
    if(Number.isNaN(date.getTime()))return 'Time unavailable';
    const formatted=new Intl.DateTimeFormat(undefined,{weekday:'short',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',timeZone:TIMEZONES[currentTimezone]}).format(date);
    return formatted+' · '+TIMEZONE_LABELS[currentTimezone];
  }

  function getLocalDayKey(utc){
    if(!utc)return 'unknown';
    const date=new Date(utc);
    if(Number.isNaN(date.getTime()))return 'unknown';
    const parts=new Intl.DateTimeFormat('en-CA',{year:'numeric',month:'2-digit',day:'2-digit',timeZone:TIMEZONES[currentTimezone]}).formatToParts(date);
    const values={};
    parts.forEach(part=>{if(part.type==='year'||part.type==='month'||part.type==='day')values[part.type]=part.value});
    return `${values.year}-${values.month}-${values.day}`;
  }

  function formatDayHeading(dayKey){
    if(dayKey==='unknown')return 'Date unavailable';
    const [year,month,day]=dayKey.split('-').map(Number);
    const date=new Date(Date.UTC(year,month-1,day,12));
    return new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric',timeZone:'UTC'}).format(date);
  }

  function render(games){
    gamesEl.innerHTML='';
    if(!games.length){gamesEl.innerHTML='<div class="empty">No games found for this week.</div>';return}
    const groups=new Map();
    games.forEach(game=>{
      const key=getLocalDayKey(game.kickoffUtc);
      if(!groups.has(key))groups.set(key,[]);
      groups.get(key).push(game);
    });
    groups.forEach((dayGames,dayKey)=>{
      const daySection=document.createElement('section');
      daySection.className='game-day';
      const heading=document.createElement('h2');
      heading.className='game-day-title';
      heading.textContent=formatDayHeading(dayKey);
      daySection.appendChild(heading);
      const dayGamesEl=document.createElement('div');
      dayGamesEl.className='game-day-games';
      dayGames.forEach(game=>{
        const card=document.createElement('article');card.className='game';
        const home=game.homeTeam, away=game.awayTeam;
        const venue=game.venue;
        const venueText=venue?[venue.name,venue.city,venue.state||venue.country].filter(Boolean).join(', '):'Venue unavailable';
        card.innerHTML=`<div class="game-top"><span>${formatKickoff(game.kickoffUtc)}</span><span class="badge">${game.status.category}</span></div><div class="teams"><div class="team"><span class="team-left"><span class="abbr">${home.abbreviation||''}</span>${home.name||'Unknown team'}</span><span class="score">${home.score??''}</span></div><div class="team"><span class="team-left"><span class="abbr">${away.abbreviation||''}</span>${away.name||'Unknown team'}</span><span class="score">${away.score??''}</span></div></div><div class="venue">${venueText}${game.neutralSite?' · Neutral site':''}</div>`;
        dayGamesEl.appendChild(card);
      });
      daySection.appendChild(dayGamesEl);
      gamesEl.appendChild(daySection);
    });
  }

  function stopAutoRefresh(){
    if(refreshTimer!==null){clearTimeout(refreshTimer);refreshTimer=null;}
  }

  function scheduleAutoRefresh(){
    stopAutoRefresh();
    const hasLive=currentGames.some((game)=>game.status.category==='LIVE');
    const hasUpcoming=currentGames.some((game)=>game.status.category==='UPCOMING');
    const delay=hasLive?AUTO_REFRESH_MS.live:hasUpcoming?AUTO_REFRESH_MS.pre:null;
    if(delay===null)return;
    refreshTimer=setTimeout(()=>loadWeek(currentWeek,true),delay);
  }

  async function loadWeek(week,isRefresh=false){
    currentWeek=week;weekSelect.value=String(week);stopAutoRefresh();
    if(activeController)activeController.abort();
    const controller=new AbortController();
    activeController=controller;
    const requestId=++loadRequestId;
    if(!isRefresh)setStatus('Loading Week '+week+'...');
    try{const response=await fetch(data.buildEspnWeekUrl(week),{cache:'no-store',signal:controller.signal});if(!response.ok)throw new Error('HTTP '+response.status);const raw=await response.json();if(requestId!==loadRequestId)return;currentGames=data.normalizeEspnScoreboard(raw);lastSuccessfulWeek=week;render(currentGames);setStatus('Week '+week+' · '+currentGames.length+' games');}
    catch(error){if(error.name==='AbortError')return;if(requestId!==loadRequestId)return;if(lastSuccessfulWeek!==null){setStatus('Could not update Week '+week+' · Showing last successful data from Week '+lastSuccessfulWeek+'.','stale');}else{setStatus('Could not load Week '+week,'error');gamesEl.innerHTML='<div class="error">The NFL game data could not be loaded right now. Please try again.</div>';}console.error(error)}
    finally{if(requestId===loadRequestId){activeController=null;scheduleAutoRefresh();}}
  }

  function setTimezone(timezoneKey){
    if(!TIMEZONES[timezoneKey]||currentTimezone===timezoneKey)return;
    currentTimezone=timezoneKey;
    updateTimezoneButtons();
    render(currentGames);
  }

  document.getElementById('prev').addEventListener('click',()=>{if(currentWeek>1)loadWeek(currentWeek-1)});
  document.getElementById('next').addEventListener('click',()=>{if(currentWeek<18)loadWeek(currentWeek+1)});
  weekSelect.addEventListener('change',()=>loadWeek(Number(weekSelect.value)));
  tzHuButton.addEventListener('click',()=>setTimezone('HU'));
  tzEtButton.addEventListener('click',()=>setTimezone('ET'));

  updateTimezoneButtons();
  loadWeek(currentWeek);
})();
</script>
</body>
</html>
